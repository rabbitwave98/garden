name: Deploy to Neocities
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      
      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@v2
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: .
